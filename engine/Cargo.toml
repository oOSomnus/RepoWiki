[package]
name = "codewiki"
version = "0.1.0"
edition = "2021"
description = "Agent-driven repository wiki generation as a standalone Rust skill"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.16", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27"

[[bin]]
name = "codewiki"
path = "src/main.rs"
